<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Buttons</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>

   <div id="header"><h1 id="h1">Light MODE activated!</h1></div>
   
   <div class="text">
   <p id="red"></p>
   <p id="nickName"></p>
   </div>

   <div class="buttons">
      <button id="b1">COLOR</button>
      <button id="b2">WELCOME</button>
      <button id="b3">IMPOSTOR</button>
      <button id="b4"><span id="danger">MALFUNCTION</span></button>
      <button id="b5"><span id="light">LIGHT</span></button>
      <button id="b6"><span id="error">ERROR</span></button>
   </div>

   <script src="script.js"></script>
</body>
</html>
